<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IndustryVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f2328; --muted:#4b5563; --line:#e3e6ea; --bg:#ffffff; --soft:#f4f6f8;
    --teal:#2aa5c9; --teal2:#1f8fb0; --orange:#f07a2c; --navy:#2c3e57;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .wrap{width:min(1080px,100% - 32px);margin:0 auto}

  /* ---------- Nav ---------- */
  nav{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
  nav .wrap{height:56px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:600;letter-spacing:-.2px}
  .brand svg{width:24px;height:30px}
  .links{display:flex;align-items:center;gap:22px;font-size:14px;letter-spacing:.3px}
  .links a{text-transform:uppercase;color:#2b3036;transition:color .2s}
  .links a:hover,.links a.active{color:var(--teal)}
  .login{background:#e8ebee;border:none;border-radius:6px;padding:9px 11px;font-size:14px;letter-spacing:.3px;color:#2b3036}
  .login:hover{background:#dde1e5}
  .burger{display:none;background:none;border:none;padding:6px}
  .burger svg{width:24px;height:24px}

  /* ---------- Hero ---------- */
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:#f5f7f9}
  /* 3D perspective room + constellation background (drawn by JS into #heroBg) */
  #heroBg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #heroBg .room line,#heroBg .room rect{stroke:#d3dbe4;stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
  #heroBg .room .edge{stroke:#c6d0db;stroke-width:1.2}
  #heroBg .stars line{stroke:#b9c7d5;stroke-width:1;animation:link 6s ease-in-out infinite}
  #heroBg .stars circle.dot{fill:#8fa6bd;animation:twinkle 3.4s ease-in-out infinite}
  #heroBg .stars circle.halo{fill:#9fc2dc;opacity:.18;animation:twinkle 3.4s ease-in-out infinite}
  @keyframes twinkle{50%{opacity:.35}}
  @keyframes link{50%{opacity:.25}}
  .hero-fade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 55% 70% at 50% 50%,rgba(245,247,249,.82),rgba(245,247,249,0) 75%)}
  .hero .wrap{position:relative;display:grid;grid-template-columns:1.7fr 1fr;align-items:center;gap:24px;padding:26px 0 26px 92px}
  .hero h1{font-size:31px;line-height:1.15;font-weight:800;color:#3a4451;letter-spacing:.3px;text-transform:uppercase}
  .hero p{font-size:16px;line-height:1.5;color:#2b3036;margin-top:14px;max-width:500px}
  .cta{display:inline-block;margin-top:20px;background:var(--teal);color:#fff;border:none;border-radius:5px;padding:10px 14px;font-size:15px;letter-spacing:.4px;box-shadow:0 2px 0 rgba(0,0,0,.06);transition:background .2s,transform .2s}
  .cta:hover{background:var(--teal2);transform:translateY(-1px)}
  .hero-art svg{width:100%;max-width:330px;display:block}
  .wave rect{animation:wave 1.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  @keyframes wave{50%{transform:scaleY(.45)}}
  .pulse-arrow{animation:nudge 1.6s ease-in-out infinite}
  @keyframes nudge{50%{transform:translateX(5px)}}
  .chip-trace{stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-18}}

  /* ---------- Search ---------- */
  .search{display:flex;justify-content:center;padding:28px 0 30px}
  .sbox{position:relative;width:min(548px,100%)}
  .sbox input{width:100%;border:1px solid #cfd4da;border-radius:24px;padding:11px 48px 11px 15px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
  .sbox input::placeholder{color:#7a828c}
  .sbox input:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(42,165,201,.14)}
  .sbox button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#8a929b;padding:4px;display:grid}
  .sbox svg{width:21px;height:21px}
  .suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,30,40,.12);overflow:hidden;display:none;z-index:10}
  .suggest.show{display:block}
  .suggest button{display:flex;width:100%;text-align:left;background:none;border:none;padding:10px 15px;font-size:14.5px;gap:10px;align-items:center;color:var(--ink)}
  .suggest button:hover,.suggest button.hi{background:#f1f7fa}
  .suggest small{color:#8a929b;margin-left:auto;font-size:12.5px}

  /* ---------- Cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding-bottom:26px}
  .card{border:1px solid #d9dde2;border-radius:8px;padding:10px 10px 16px;background:#fff;box-shadow:0 1px 4px rgba(20,30,40,.06);
    display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .25s,box-shadow .25s,opacity .25s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(20,30,40,.12)}
  .card.dim{opacity:.28;transform:scale(.97)}
  .card .art{width:100%;aspect-ratio:223/122;background:#f1f3f6;border-radius:6px;overflow:hidden}
  .card .art svg{width:100%;height:100%;display:block}
  .card h3{font-size:19px;font-weight:500;text-transform:uppercase;letter-spacing:.2px;line-height:1.2;margin-top:12px;min-height:46px;display:flex;align-items:center}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:6px}
  .stats span{font-size:12.5px;color:#2b3036;display:block;white-space:nowrap}
  .stats b{white-space:nowrap;font-size:16.5px;font-weight:600;display:block;margin-top:3px}
  .card .go{margin-top:14px;border:none;border-radius:20px;padding:9px 20px;min-width:150px;color:#fff;font-size:16px;letter-spacing:.6px;text-transform:uppercase;transition:filter .2s,transform .2s}
  .card .go:hover{filter:brightness(1.08);transform:scale(1.03)}
  .b1{background:#6ab4e0}.b2{background:#4a1f6a}.b3{background:#3f4b98}.b4{background:#2eb4be}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0;display:none}

  /* ---------- Footer ---------- */
  footer{margin-top:auto;border-top:1px solid var(--line)}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 0 14px}
  .social{display:flex;gap:16px}
  .social a{color:#3b4148;display:grid;transition:color .2s}
  .social a:hover{color:var(--teal)}
  .social svg{width:22px;height:22px}
  .flinks{display:flex;gap:18px;font-size:16px;color:#3b4148}
  .flinks a:hover{color:var(--teal)}

  /* ---------- Modal (about / contact / login / coming soon) ---------- */
  .modal{position:fixed;inset:0;background:rgba(20,28,38,.45);display:grid;place-items:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;padding:16px}
  .modal.show{opacity:1;pointer-events:auto}
  .mbox{background:#fff;border-radius:12px;padding:26px 26px 22px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.2);transform:translateY(12px);transition:transform .25s}
  .modal.show .mbox{transform:none}
  .mbox h2{font-size:21px;margin-bottom:10px}
  .mbox p{color:var(--muted);line-height:1.55;font-size:15px}
  .mbox input{width:100%;margin-top:10px;border:1px solid #cfd4da;border-radius:7px;padding:10px 12px;font:inherit}
  .mbox .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
  .mbox .ghost{background:#eef1f4;border:none;border-radius:6px;padding:9px 14px}
  .mbox .prim{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:9px 14px}

  /* ---------- Page transition ---------- */
  #veil{position:fixed;inset:0;background:#0d1015;z-index:100;opacity:0;pointer-events:none;transition:opacity .45s}
  #veil.on{opacity:1}

  /* ---------- Responsive ---------- */
  @media (max-width:980px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .hero .wrap{padding-left:0}
  }
  @media (max-width:760px){
    .links{display:none;position:absolute;top:56px;left:0;right:0;background:#fff;flex-direction:column;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line);gap:14px}
    .links.open{display:flex}
    .burger{display:block}
    .hero .wrap{grid-template-columns:1fr;text-align:left}
    .hero h1{font-size:25px}
    .hero-art{order:-1}
    .hero-art svg{max-width:260px;margin:0 auto}
  }
  @media (max-width:520px){
    .cards{grid-template-columns:1fr}
    footer .wrap{flex-direction:column;gap:12px}
  }
</style>
</head>

/* ============ Render cards ============ */
const cardsEl = document.getElementById("cards");
cardsEl.innerHTML = CAREERS.map(c => `
  <article class="card" data-key="${c.key}">
    <div class="art">${ART[c.art]}</div>
    <h3>${c.title}</h3>
    <div class="stats">
      <div><span>Video Time:</span><b>${c.time}</b></div>
      <div><span>Salary:</span><b>${c.salary}</b></div>
      <div><span>Demand:</span><b>${c.demand}</b></div>
    </div>
    <button class="go ${c.cls}" data-open="${c.key}">${c.btn}</button>
  </article>`).join("") + `<div class="empty" id="empty">No careers match that yet — try “cloud”, “data” or “risk”.</div>`;

cardsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-open]"); if (b) openCareer(b.dataset.open);
});

function openCareer(key){
  const c = CAREERS.find(x => x.key === key);
  if (!c) return;
  if (c.href) {
    document.getElementById("veil").classList.add("on");
    setTimeout(() => location.href = c.href, 420);
  } else {
    showModal(`<h2>${c.title}</h2><p>The ${c.title} video and skill tree are being generated. The Cloud Computing Architect path is live now if you want to try the full experience.</p>
      <div class="row"><button class="ghost" data-close>Close</button><button class="prim" data-open-cloud>Try Cloud Architect</button></div>`);
  }
}

/* ============ Search ============ */
const q = document.getElementById("q"), sug = document.getElementById("suggest");
let hi = -1, matches = [];
function score(c, t){
  t = t.toLowerCase().trim(); if (!t) return 1;
  const hay = (c.title + " " + c.tags).toLowerCase();
  return t.split(/\s+/).every(w => hay.includes(w)) ? 1 : 0;
}
function filter(){
  const t = q.value;
  matches = CAREERS.filter(c => score(c, t));
  document.querySelectorAll(".card").forEach(el => el.classList.toggle("dim", !!t.trim() && !matches.some(m => m.key === el.dataset.key)));
  document.getElementById("empty").style.display = (t.trim() && !matches.length) ? "block" : "none";
  hi = -1;
  if (t.trim() && matches.length) {
    sug.innerHTML = matches.map((m,i) => `<button data-i="${i}">${m.title}<small>${m.time} video · ${m.salary}</small></button>`).join("");
    sug.classList.add("show");
  } else sug.classList.remove("show");
}
q.addEventListener("input", filter);
q.addEventListener("keydown", e => {
  const items = [...sug.querySelectorAll("button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((b,i) => b.classList.toggle("hi", i === hi));
  } else if (e.key === "Enter") {
    const m = matches[hi >= 0 ? hi : 0]; if (m) openCareer(m.key);
  } else if (e.key === "Escape") { sug.classList.remove("show"); }
});
sug.addEventListener("mousedown", e => { const b = e.target.closest("button"); if (b) { e.preventDefault(); openCareer(matches[+b.dataset.i].key); } });
q.addEventListener("blur", () => setTimeout(() => sug.classList.remove("show"), 120));
q.addEventListener("focus", () => { if (q.value.trim()) filter(); });
document.getElementById("qbtn").onclick = () => { const m = matches[0]; if (q.value.trim() && m) openCareer(m.key); else q.focus(); };

/* ============ Nav, scroll & modals ============ */
document.querySelectorAll("[data-scroll]").forEach(a => a.addEventListener("click", e => {

  document.getElementById("links").classList.remove("open");
}));

const modal = document.getElementById("modal"), mbox = document.getElementById("mbox");
function showModal(html){ mbox.innerHTML = html; modal.classList.add("show"); }
document.querySelectorAll("[data-modal]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); showModal(MODALS[a.dataset.modal]); }));
modal.addEventListener("click", e => {
  if (e.target === modal || e.target.closest("[data-close]")) modal.classList.remove("show");
  if (e.target.closest("[data-open-cloud]")) { modal.classList.remove("show"); openCareer("cloud"); }
  if (e.target.closest("[data-thanks]")) { mbox.innerHTML = `<h2>Thanks!</h2><p>This is a demo — nothing was sent or stored.</p><div class="row"><button class="prim" data-close>Close</button></div>`; }
});
addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("show"); });
addEventListener("pageshow", () => document.getElementById("veil").classList.remove("on"));

/* ============ Hero background: 3D grid room + side constellations ============ */
(function(){
  const svg = document.getElementById("heroBg"), hero = svg.parentElement;
  function rng(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function draw(){
    const W = hero.clientWidth, H = hero.clientHeight; if (!W || !H) return;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const cx = W/2, cy = H*0.5, bw = Math.min(W*0.44, 640), bh = H*0.44;
    const B = { l:cx-bw/2, r:cx+bw/2, t:cy-bh/2, b:cy+bh/2 };
    const lerp = (a,b,t) => a + (b-a)*t, L = [];
    const line = (x1,y1,x2,y2,c) => L.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"${c?` class="${c}"`:""}/>`);
    // depth steps (closer together toward the back = perspective)
    const T = [0.2,0.36,0.49,0.6,0.69,0.77,0.84,0.9,0.95];
    // corner edges + back wall
    line(0,0,B.l,B.t,"edge"); line(W,0,B.r,B.t,"edge"); line(0,H,B.l,B.b,"edge"); line(W,H,B.r,B.b,"edge");
    L.push(`<rect x="${B.l}" y="${B.t}" width="${bw}" height="${bh}" class="edge"/>`);
    T.forEach(t => {
      const xl = lerp(0,B.l,t), xr = lerp(W,B.r,t), yt = lerp(0,B.t,t), yb = lerp(H,B.b,t);
      line(xl,yb,xr,yb); line(xl,yt,xr,yt);   // floor + ceiling rungs
      line(xl,yt,xl,yb); line(xr,yt,xr,yb);   // side wall rungs
    });
    // lines running toward the vanishing point
    const nx = Math.max(8, Math.round(W/110));
    for (let i=1;i<nx;i++){ const f=i/nx, x0=f*W, x1=lerp(B.l,B.r,f); line(x0,H,x1,B.b); line(x0,0,x1,B.t); line(x1,B.t,x1,B.b); }
    const ny = 5;
    for (let i=1;i<ny;i++){ const f=i/ny, y0=f*H, y1=lerp(B.t,B.b,f); line(0,y0,B.l,y1); line(W,y0,B.r,y1); line(B.l,y1,B.r,y1); }
    // constellations on both sides
    const S = [], r = rng(7);
    const side = (x0,x1) => { const pts=[]; for (let i=0;i<9;i++) pts.push([lerp(x0,x1,r()), lerp(H*0.08,H*0.92,r()), 1.8+r()*1.8, (r()*3).toFixed(2)]); return pts; };
    const zones = W > 760 ? [side(16, Math.min(250, W*0.18)), side(W - Math.min(250, W*0.18), W-16)] : [side(10, W*0.3), side(W*0.7, W-10)];
    zones.forEach(pts => {
      pts.forEach((a,i) => {
        const near = pts.map((b,j) => [j, Math.hypot(a[0]-b[0], a[1]-b[1])]).filter(([j]) => j>i).sort((p,q) => p[1]-q[1]).slice(0,2);
        near.forEach(([j,d]) => { if (d < 150) S.push(`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" style="animation-delay:${(i*.7).toFixed(1)}s"/>`); });
      });
      pts.forEach(([x,y,rad,dl]) => S.push(`<circle class="halo" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rad*3).toFixed(1)}" style="animation-delay:${dl}s"/><circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}" style="animation-delay:${dl}s"/>`));
    });
    svg.innerHTML = `<g class="room">${L.join("")}</g><g class="stars">${S.join("")}</g>`;
  }
  draw();
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 120); });
  if (window.ResizeObserver) new ResizeObserver(() => { clearTimeout(t); t = setTimeout(draw, 120); }).observe(hero);
})();
</script>
